<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>EPIKODI bench</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: system-ui, sans-serif; background:#111; color:#eee; }
  header { padding:16px 24px; background:#1c1c1c; border-bottom:1px solid #333; display:flex; gap:16px; align-items:baseline; }
  h1 { margin:0; font-size:20px; }
  .stack { color:#9cf; font-size:13px; }
  main { padding:16px 24px; }
  ul { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
  li { background:#1c1c1c; border:1px solid #333; border-radius:6px; padding:8px 12px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li.dir { border-color:#39f; }
</style>
</head>
<body>
<header><h1>EPIKODI</h1><span class="stack" id="stack">…</span><span id="count"></span></header>
<main><ul id="list"></ul></main>
<script>
  // Pont natif : Electron expose window.bridge via preload ; Tauri expose window.__TAURI__.
  if (!window.bridge && window.__TAURI__) {
    const { invoke } = window.__TAURI__.core;
    window.bridge = {
      name: 'Tauri',
      listDir: (p) => invoke('list_dir', { path: p }),
      ready: () => invoke('ready'),
    };
  }
  (async () => {
    const b = window.bridge;
    document.getElementById('stack').textContent = b.name;
    const entries = await b.listDir(null);
    const ul = document.getElementById('list');
    for (const e of entries) {
      const li = document.createElement('li');
      li.textContent = e.name;
      if (e.isDir) li.className = 'dir';
      ul.appendChild(li);
    }
    document.getElementById('count').textContent = `${entries.length} entrées`;
    // Attendre que la frame soit effectivement peinte avant de signaler READY.
    requestAnimationFrame(() => requestAnimationFrame(() => b.ready()));
  })();
</script>
</body>
</html>
