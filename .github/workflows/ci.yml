name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    name: build + smoke · ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # 1) L'application s'ouvre, rend sa fenêtre et quitte : preuve qu'elle se lance sur l'OS.
      # 2) Le MKV HEVC/AC3 doit produire des octets audio décodés : preuve que le transcodage
      #    ffmpeg (issue #15) fonctionne avec le binaire ffmpeg-static de la plateforme.
      # 3) Le MP4 H.264/AAC natif doit être seekable (issue #2).
      - name: ffmpeg embarqué
        shell: bash
        run: node -e "console.log(require('ffmpeg-static'))" && "$(node -p "require('ffmpeg-static')")" -version | head -1

      - name: Smoke
        shell: bash
        env:
          # Sous Linux : écran virtuel, pas de sandbox ; sans carte son, Chromium utilise une sortie audio nulle.
          RUN: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }}
          EPIKODI_DB_PATH: smoke-epikodi.db
          FLAGS: ${{ runner.os == 'Linux' && '--no-sandbox --disable-audio-output' || '' }}
        run: |
          smoke() {
            rm -f smoke.txt
            t0=$(date +%s)
            $RUN npx cross-env EPIKODI_SMOKE=1 EPIKODI_SMOKE_OUT=smoke.txt "$@" npx electron . $FLAGS > smoke.log 2>&1 || echo "electron exit=$?"
            echo "--- $* ($(( $(date +%s) - t0 )) s)"; cat smoke.txt 2>/dev/null || { echo "(pas de rapport)"; grep -vE "dbus" smoke.log | head -20; }
          }
          smoke
          grep SMOKE_OK smoke.txt
          smoke EPIKODI_SMOKE_FILE=tests/fixtures/pattern-hevc-ac3.mkv
          grep -E 'SMOKE_MEDIA audio=[1-9][0-9]* video=[1-9]' smoke.txt
          smoke EPIKODI_SMOKE_FILE=tests/fixtures/pattern-h264-aac.mp4
          grep -E 'seekable=3' smoke.txt
          # 4) Indexation de tests/fixtures : 4 médias valides (mp4, mkv, mp3, flac) dont 2 déjà
          #    enregistrés par les lectures précédentes (→ ignorés par l'incrémental), corrupt.mp4
          #    rejeté, unsupported.xyz ignoré (pas une extension média), 2 vignettes générées.
          smoke EPIKODI_SMOKE_SOURCE=tests/fixtures EPIKODI_THUMBS_DIR=smoke-thumbs
          grep -E 'SMOKE_SCAN indexed=2 skipped=2 rejected=1 files=4 thumbs=2 error=none' smoke.txt
          # 5) La bibliothèque SQLite a bien enregistré les deux fichiers lus et leur état de lecture.
          node -e "const {DatabaseSync}=require('node:sqlite'); const db=new DatabaseSync('smoke-epikodi.db'); const f=db.prepare('select count(*) c from media_files').get().c; const p=db.prepare('select count(*) c from playback_state').get().c; console.log('media_files='+f+' playback_state='+p); process.exit(f===4&&p===2?0:1)"

      - name: Package (sans installateur)
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
