name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    name: build + smoke · ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # L'application s'ouvre, rend sa fenêtre et quitte : preuve qu'elle se lance sur l'OS.
      - name: Smoke (Linux, écran virtuel)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx cross-env EPIKODI_SMOKE=1 npx electron . --no-sandbox | grep -q SMOKE_OK
      - name: Smoke (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: npx cross-env EPIKODI_SMOKE=1 npx electron . | grep -q SMOKE_OK

      - name: Package (sans installateur)
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
